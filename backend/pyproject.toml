[project]
name = "ragagent-backend"
version = "0.1.0"
description = "EKB 企业知识库与智能问答系统 - 后端服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "redis>=5.0",
    "pymilvus>=2.5",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "langchain-core>=1.6.3,<1.7",
    "langchain-openai>=1.6.2,<1.7",
    "langchain-milvus>=0.4.0,<0.5",
    "langsmith>=0.12.4,<0.13",
    # 文档上传与解析入库：httpx（MinerU 云 API HTTP 直连）、celery（长任务）、
    # python-multipart（multipart 上传）；redis 已在上文声明（broker 复用）
    "httpx>=0.27",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymilvus.*", "alembic.*", "celery.*"]
ignore_missing_imports = true

# Celery 任务装饰器无类型桩：`@celery.task` 与 `self` 参数无法静态校验，
# 属已知第三方限制，放宽该模块的装饰器相关错误码。
[[tool.mypy.overrides]]
module = ["app.tasks.*"]
disable_error_code = ["untyped-decorator", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["app.domain.*"]
strict = true
