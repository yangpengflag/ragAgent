[project]
name = "ragagent-backend"
version = "0.1.0"
description = "EKB 企业知识库与智能问答系统 - 后端服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "redis>=5.0",
    "pymilvus>=2.5",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymilvus.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*"]
strict = true
